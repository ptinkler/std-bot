[project]
name = "std-bot"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.20.1",
    "discord-py==2.7.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.0.58",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "B", "UP", "SIM", "C4", "RUF", "PL", "PERF",
    "PT", "TRY", "ASYNC", "S", "ARG", "RET", "PIE", "BLE", "T20",
]
ignore = [
    "PLR2004",  # magic numbers: Discord limits and calendar constants read fine inline
    "TRY003",   # long messages in exceptions
    "RUF001", "RUF002",  # deliberate typographic characters (en dash, union sign) in user-facing text
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR0913", "PLC0415", "SLF001", "ARG001", "E402"]
