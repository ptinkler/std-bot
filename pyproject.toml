[project]
name = "std-bot"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.18.4",
    "discord-py==2.7.1",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
